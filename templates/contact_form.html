{% extends "base.html" %}
{% block title %}{{ "Modifier" if contact else "Nouveau" }} Contact{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <div class="form-card-header">
            <a href="{{ url_for('contacts') }}" class="back-link">
                <i data-lucide="arrow-left" style="width:14px;height:14px;"></i> Retour
            </a>
            <h2>{{ "Modifier le contact" if contact else "Nouveau contact" }}</h2>
        </div>

        <form method="POST" class="contact-form">
            <div class="form-group">
                <label for="name">
                    <i data-lucide="user" class="label-icon"></i> Nom complet <span class="required">*</span>
                </label>
                <input type="text" id="name" name="name"
                       value="{{ contact.name if contact else request.form.get('name', '') }}"
                       placeholder="Ex : Alice Dupont" required autofocus>
            </div>

            <div class="form-group">
                <label for="email">
                    <i data-lucide="mail" class="label-icon"></i> Adresse e-mail <span class="required">*</span>
                </label>
                <input type="email" id="email" name="email"
                       value="{{ contact.email if contact else request.form.get('email', '') }}"
                       placeholder="Ex : alice@example.com" required>
            </div>

            <div class="form-group">
                <label for="phone">
                    <i data-lucide="phone" class="label-icon"></i> Numéro de téléphone <span class="required">*</span>
                </label>
                <input type="text" id="phone" name="phone"
                       value="{{ contact.phone if contact else request.form.get('phone', '') }}"
                       placeholder="Ex : +212 6 00 00 00 00" required>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('contacts') }}" class="btn btn-secondary">Annuler</a>
                <button type="submit" class="btn btn-primary">
                    <i data-lucide="check" class="icon"></i>
                    {{ "Enregistrer les modifications" if contact else "Ajouter le contact" }}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
{% endblock %}
